title: Man in blue tunic hauling on a stem overhead
description: A full-length man in a blue tunic and a white coif, with orange hose and shoes, bends sideways with his head tilted to the right and his left hand on his hip while his right arm reaches over his head to grip a stem; only a small cream stub of the stem remains above his hand. Black outlines, pale pink face with red cheeks, white highlights on the folds. Cut from the foliate extension of the initial P; the background is transparent.
