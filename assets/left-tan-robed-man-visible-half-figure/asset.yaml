title: Half-length man in tan robe gesturing right
description: A half-length man in a tan robe and a flat red cap, turned to the right, holding both hands up before him with the index fingers raised in speech. Brown curls, a short beard and a pale face outlined in black. The figure ends at the thighs where the gold ground of the initial stopped. Cut from the left half of the two-figure scene; the background is transparent.
