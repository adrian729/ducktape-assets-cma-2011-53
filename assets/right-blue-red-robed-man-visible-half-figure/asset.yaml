description: A half-length man turned to the left with his face raised, in an orange-red mantle over a dark blue robe, his right hand laid flat on his chest. Brown curls, a short beard and a pale face outlined in black. The figure ends at the hips where the gold ground of the initial stopped. Cut from the right half of the two-figure scene; the background is transparent.
