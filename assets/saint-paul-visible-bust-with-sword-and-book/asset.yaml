title: Saint Paul with sword and book, cut-out
description: Saint Paul to the waist, bald with brown hair at the sides and a pointed beard, his head turned up to the right. He wears a tan tunic under a dark blue mantle and carries a large blue sword over his left shoulder, its round pommel at his hand, while his left hand holds a closed book with a brown cover and pink edges. A blue arc around the head stands for the halo. Cut from the gold counter of the initial P; the background is transparent.
