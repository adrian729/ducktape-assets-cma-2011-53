# descriptive: find it and understand it
id: saint-paul-with-sword-and-book
title: Saint Paul with sword and book on gold
description: The oval counter of the initial P. Saint Paul to the waist, bald with brown hair at the sides and a pointed beard, head turned up to the right, in a tan tunic under a dark blue mantle, a large blue sword over his left shoulder and a closed brown book with pink edges in his left hand, a blue arc for the halo. He fills a burnished gold ground that is crazed and worn, cut along the letter strokes to a rough oval with a flat base. Opaque inside the oval, transparent outside.
