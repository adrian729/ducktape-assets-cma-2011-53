# descriptive: find it and understand it
id: two-facing-men-on-gold-with-central-tan-band
title: Two men conversing across a tan bar on gold
description: Two half-length men face each other across a vertical tan bar with a darker stripe, on a burnished gold ground cut along the letter strokes. At the left a man in a tan robe and flat red cap gestures with both hands raised; at the right a man in an orange-red mantle over a dark blue robe looks up at him with a hand on his chest. Both have brown curls and short beards. Opaque on the gold, transparent outside its irregular edge.
